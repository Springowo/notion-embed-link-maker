<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notion Embed Link Maker</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f4f5f7;
        color: #17181f;
        font-family:
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(100%, 980px);
        margin: 0 auto;
        padding: 28px 16px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 1.35rem;
        line-height: 1.3;
      }

      .panel {
        border: 1px solid #d9dde8;
        border-radius: 8px;
        background: #fff;
        padding: 16px;
      }

      label {
        display: block;
        margin: 0 0 8px;
        font-size: 0.92rem;
        font-weight: 700;
      }

      label + input,
      label + textarea {
        margin-bottom: 14px;
      }

      textarea,
      input {
        width: 100%;
        border: 1px solid #cfd5e3;
        border-radius: 6px;
        background: #fff;
        color: #17181f;
        font: inherit;
      }

      textarea {
        min-height: 360px;
        padding: 12px;
        resize: vertical;
        font-family:
          Consolas,
          "SFMono-Regular",
          monospace;
        font-size: 0.88rem;
        line-height: 1.5;
      }

      input {
        min-height: 44px;
        padding: 0 12px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0 18px;
      }

      button,
      a.download {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        border: 0;
        border-radius: 6px;
        padding: 0 14px;
        background: #3157dd;
        color: #fff;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      button.secondary,
      a.download {
        background: #2a2d38;
      }

      .status {
        min-height: 22px;
        margin-top: 8px;
        color: #3055d8;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .preview {
        width: 100%;
        height: 220px;
        margin: 0 0 18px;
        border: 1px solid #cfd5e3;
        border-radius: 6px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Notion Embed Link Maker</h1>

      <section class="panel">
        <label for="rendererUrl">개인 렌더러 URL</label>
        <input
          id="rendererUrl"
          placeholder="자동으로 현재 사이트의 renderer 주소를 사용합니다."
        />

        <label for="htmlCode">HTML 코드</label>
        <textarea id="htmlCode" spellcheck="false"><style>
@font-face {
    font-family: 'InkLipquid';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/InkLipquid.woff') format('woff');
    font-weight: normal;
    font-style: normal;
}
@font-face {
    font-family: 'Pretendard-Regular';
    src: url('https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff');
    font-weight: 400;
    font-style: normal;
}

body {
  margin: 0;
  box-sizing: border-box;
}

* {
  box-sizing: inherit;
}

.quote-wrap {
  width: min(100%, 720px);
  margin: 0 auto;
  padding: 10px 18px 18px;
  text-align: center;
}

.catchphrase {
  font-family: 'Pretendard-Regular';
  font-size: 0.8em;
  text-align: center;
  letter-spacing: 0.9em;
  color: rgb(22, 23, 49); /* 캐치프레이즈 색상 */
}
 
.mille_says {
  margin-top: 28px;
  font-family: 'InkLipquid';
  text-align: center;
  font-size: 1.5em;
  line-height: 1.65;
  color: rgb(53, 97, 241); /* 한마디 색상 */
}
</style>

<main class="quote-wrap">
  <!-- 캐치프레이즈를 입력하세요 -->
  <div class="catchphrase">캐치프레이즈</div>

  <!-- 한마디를 입력하세요. 원하는 위치에 <br>을 넣으면 줄바꿈됩니다. -->
  <div class="mille_says">
    “이것이 신들의 진실이라면, 나는 신 대신에<br>
    인간의 마음을 선택하겠습니다.”
  </div>
</main></textarea>

        <label for="previewFrame">미리보기</label>
        <iframe
          class="preview"
          id="previewFrame"
          title="HTML 미리보기"
          sandbox="allow-same-origin"
        ></iframe>

        <div class="actions">
          <button type="button" id="makeLink">링크 만들기</button>
          <button type="button" class="secondary" id="copyLink">링크 복사</button>
          <a class="download" id="downloadLink" download="notion-embed-link.txt" href="#">txt 저장</a>
        </div>

        <label for="resultLink">Notion 임베드 링크</label>
        <input id="resultLink" readonly />
        <div class="status" id="status"></div>
      </section>
    </main>

    <script>
      const rendererUrl = document.querySelector("#rendererUrl");
      const htmlCode = document.querySelector("#htmlCode");
      const resultLink = document.querySelector("#resultLink");
      const statusText = document.querySelector("#status");
      const makeButton = document.querySelector("#makeLink");
      const copyButton = document.querySelector("#copyLink");
      const downloadLink = document.querySelector("#downloadLink");
      const previewFrame = document.querySelector("#previewFrame");
      let previewTimer = 0;

      rendererUrl.value = new URL("renderer/", window.location.href).href;

      function normalizeRendererUrl(value) {
        const url = new URL(value.trim());
        return url.href;
      }

      function makeNotionLink() {
        try {
          const baseUrl = normalizeRendererUrl(rendererUrl.value);
          const encoded = encodeURIComponent(`${htmlCode.value}nt`);
          const link = `${baseUrl}?c=${encoded}`;
          resultLink.value = link;
          downloadLink.href = URL.createObjectURL(
            new Blob([link], { type: "text/plain;charset=utf-8" }),
          );
          statusText.textContent = "링크가 만들어졌습니다.";
          return link;
        } catch (error) {
          resultLink.value = "";
          statusText.textContent = "렌더러 URL을 확인해 주세요.";
          return "";
        }
      }

      async function copyNotionLink() {
        const link = resultLink.value || makeNotionLink();

        if (!link) {
          return;
        }

        try {
          await navigator.clipboard.writeText(link);
          statusText.textContent = "링크가 복사되었습니다.";
        } catch (error) {
          resultLink.focus();
          resultLink.select();
          document.execCommand("copy");
          statusText.textContent = "링크가 복사되었습니다.";
        }
      }

      function updatePreview() {
        previewFrame.srcdoc = htmlCode.value;
      }

      function schedulePreview() {
        window.clearTimeout(previewTimer);
        previewTimer = window.setTimeout(updatePreview, 150);
      }

      makeButton.addEventListener("click", makeNotionLink);
      copyButton.addEventListener("click", copyNotionLink);

      rendererUrl.addEventListener("input", () => {
        resultLink.value = "";
        statusText.textContent = "";
      });

      htmlCode.addEventListener("input", () => {
        resultLink.value = "";
        statusText.textContent = "";
        schedulePreview();
      });

      updatePreview();
    </script>
  </body>
</html>
