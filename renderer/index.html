<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notion HTML Renderer</title>
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(window.location.search);
      let html = params.get("c") || "";

      function safeDecode(value) {
        try {
          return decodeURIComponent(value);
        } catch (error) {
          return value;
        }
      }

      html = safeDecode(html);

      if (html.endsWith("nt")) {
        html = html.slice(0, -2);
      }

      if (html.trim()) {
        document.open();
        document.write(html);
        document.close();
      } else {
        document.body.textContent = "HTML을 불러오지 못했습니다.";
      }
    </script>
  </body>
</html>
